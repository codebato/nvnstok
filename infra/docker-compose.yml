services:
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_SECURE_COOKIE=false
      - TZ=Europe/Istanbul
    volumes:
      - n8n_data:/home/node/.n8n

  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "5432:5432"              
    environment:
      - POSTGRES_USER=nvnstok
      - POSTGRES_PASSWORD=nvnstok_dev_pw   
      - POSTGRES_DB=nvnstok
    volumes:
      - postgres_data:/var/lib/postgresql/data  

volumes:
  n8n_data:
  postgres_data:                 